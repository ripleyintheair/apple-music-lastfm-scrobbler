[lastfm]
# Get these for free at: https://www.last.fm/api/account/create
# Use any app name you like (e.g. "My Scrobbler"). No callback URL needed.
api_key = YOUR_API_KEY_HERE
api_secret = YOUR_API_SECRET_HERE

# This gets filled in automatically when you run: python3 scrobbler.py setup
session_key =

[scrobbler]
# How often to check for new plays, in seconds (default: 300 = 5 minutes)
poll_interval = 300

# How far back to look for plays, in days (default: 7)
# On first run, this will backfill any plays from the last N days.
lookback_days = 7
